<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件共享平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 2rem; color: white; font-size: 2rem; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        
        .upload-area {
            background: white;
            border-radius: 16px;
            padding: 4rem 2rem;
            text-align: center;
            margin-bottom: 2rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border: 3px dashed #e0e0e0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .upload-area:hover, .upload-area.drag-over {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateY(-2px);
        }
        .upload-area .icon { font-size: 4rem; margin-bottom: 1rem; }
        .upload-area p { color: #666; margin: 0.5rem 0; font-size: 1rem; }
        
        .upload-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 500;
        }
        .upload-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .upload-button:active {
            transform: scale(0.98);
        }
        
        #fileInput {
            display: none;
        }
        
        .progress-container {
            display: none;
            margin-bottom: 2rem;
            padding: 1rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .progress-bar {
            height: 12px;
            background: #eee;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            color: #666;
            font-size: 0.9rem;
        }
        
        .search-container {
            margin-bottom: 1rem;
        }
        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            outline: none;
        }
        .search-input:focus {
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
        }
        
        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
        }
        
        .file-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .file-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .file-card .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .file-name {
            font-weight: 500;
            color: #333;
            margin: 0.5rem 0;
            word-break: break-all;
            font-size: 0.9rem;
        }
        .file-meta {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 0.8rem;
        }
        .file-actions {
            display: flex;
            gap: 0.4rem;
            justify-content: center;
        }
        .action-btn {
            padding: 5px 12px;
            font-size: 0.7rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .action-btn:hover { opacity: 0.9; }
        .preview-btn { background: #667eea; color: white; }
        .download-btn { background: #28a745; color: white; }
        .delete-btn { background: #dc3545; color: white; }
        
        .empty-state, .loading-state {
            text-align: center;
            color: white;
            padding: 3rem;
            font-size: 1.1rem;
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 1.5rem;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #eee;
        }
        .modal-header h3 { color: #333; margin: 0; }
        .close-btn {
            cursor: pointer;
            font-size: 1.5rem;
            color: #999;
            line-height: 1;
        }
        .close-btn:hover { color: #666; }
        
        #previewContent img, #previewContent video {
            max-width: 100%;
            max-height: 60vh;
            display: block;
            margin: 0 auto;
            border-radius: 8px;
        }
        #previewContent iframe {
            width: 100%;
            height: 60vh;
            border: none;
            border-radius: 8px;
        }
        #previewContent pre {
            background: #f5f5f5;
            padding: 1rem;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 60vh;
            overflow-y: auto;
        }
        .no-preview {
            text-align: center;
            color: #999;
            padding: 3rem;
        }
        
        @media (max-width: 600px) {
            body { padding: 1rem; }
            .upload-area { padding: 2.5rem 1rem; }
            .files-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .modal-content { margin: 10% auto; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 文件共享平台</h1>
        
        <div class="upload-area" id="uploadArea">
            <div class="icon">📤</div>
            <p>拖拽文件到此处上传</p>
            <p>或</p>
            <button class="upload-button" id="uploadButton">选择文件</button>
            <input type="file" id="fileInput" multiple>
        </div>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-text" id="progressText">上传中...</div>
        </div>
        
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索文件...">
        </div>
        
        <div class="files-grid" id="filesGrid">
            <div class="loading-state">加载中...</div>
        </div>
    </div>
    
    <div class="modal-overlay" id="previewModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="previewTitle"></h3>
                <span class="close-btn" id="closeModal">&times;</span>
            </div>
            <div id="previewContent"></div>
            <div style="margin-top: 1rem; text-align: center;">
                <a id="downloadLink" download style="display: inline-block; padding: 10px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 8px; text-decoration: none; font-weight: 500;">下载文件</a>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_REPO = 'star-sky-suger/myku';
        const GH_TOKEN = '';
        const FILES_DIR = 'files/';
        let allFiles = [];

        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded successfully');
            console.log('Config:', { GITHUB_REPO, hasToken: GH_TOKEN ? 'Yes' : 'No' });

            const uploadArea = document.getElementById('uploadArea');
            const uploadButton = document.getElementById('uploadButton');
            const fileInput = document.getElementById('fileInput');
            const searchInput = document.getElementById('searchInput');

            uploadButton.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('Upload button clicked');
                fileInput.click();
            });

            uploadArea.addEventListener('click', function(e) {
                if (e.target !== uploadButton) {
                    console.log('Upload area clicked');
                    fileInput.click();
                }
            });

            fileInput.addEventListener('change', function(e) {
                const files = Array.from(e.target.files);
                console.log('Files selected:', files.length);
                if (files.length > 0) {
                    handleFiles(files);
                }
                e.target.value = '';
            });

            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.stopPropagation();
                uploadArea.classList.add('drag-over');
                console.log('Drag over');
            });

            uploadArea.addEventListener('dragleave', function(e) {
                e.preventDefault();
                e.stopPropagation();
                uploadArea.classList.remove('drag-over');
                console.log('Drag leave');
            });

            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                e.stopPropagation();
                uploadArea.classList.remove('drag-over');
                
                const files = Array.from(e.dataTransfer.files);
                console.log('Files dropped:', files.length);
                if (files.length > 0) {
                    handleFiles(files);
                }
            });

            document.addEventListener('dragover', function(e) { e.preventDefault(); });
            document.addEventListener('drop', function(e) { e.preventDefault(); });

            searchInput.addEventListener('input', function(e) {
                filterFiles(e.target.value);
            });

            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('previewModal').addEventListener('click', function(e) {
                if (e.target === document.getElementById('previewModal')) {
                    closeModal();
                }
            });

            loadFiles();
        });

        function handleFiles(files) {
            if (!GH_TOKEN) {
                alert('错误：未配置上传令牌，请检查部署配置');
                return;
            }

            const maxSize = 100 * 1024 * 1024;
            const oversized = files.filter(f => f.size > maxSize);
            if (oversized.length > 0) {
                alert('以下文件超过100MB限制：\n' + oversized.map(f => f.name).join('\n'));
                files = files.filter(f => f.size <= maxSize);
            }

            if (files.length === 0) return;

            showProgress();
            const totalSize = files.reduce((sum, f) => sum + f.size, 0);
            let uploadedSize = 0;

            (async function() {
                for (const file of files) {
                    try {
                        await uploadFile(file);
                        uploadedSize += file.size;
                        const pct = Math.round((uploadedSize / totalSize) * 100);
                        updateProgress(pct, uploadedSize, totalSize);
                    } catch (err) {
                        console.error('Upload error:', err);
                        alert('上传失败: ' + err.message);
                    }
                }
                hideProgress();
                await sleep(2000);
                loadFiles();
            })();
        }

        async function uploadFile(file) {
            const filename = Date.now() + '-' + file.name;
            const content = await readFileAsBase64(file);

            const response = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + FILES_DIR + filename, {
                method: 'PUT',
                headers: {
                    'Accept': 'application/vnd.github.v3+json',
                    'Authorization': 'token ' + GH_TOKEN,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: 'Upload: ' + file.name,
                    content: content,
                    branch: 'main'
                })
            });

            if (!response.ok) {
                const error = await response.json().catch(() => ({ message: 'Unknown error' }));
                throw new Error(error.message || 'HTTP ' + response.status);
            }
        }

        async function deleteFile(filename) {
            if (!confirm('确定删除此文件?')) return;

            const getResponse = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + FILES_DIR + filename, {
                headers: { 'Authorization': 'token ' + GH_TOKEN }
            });

            if (!getResponse.ok) {
                alert('获取文件信息失败');
                return;
            }

            const fileInfo = await getResponse.json();

            const deleteResponse = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + FILES_DIR + filename, {
                method: 'DELETE',
                headers: {
                    'Authorization': 'token ' + GH_TOKEN,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: 'Delete: ' + filename,
                    sha: fileInfo.sha,
                    branch: 'main'
                })
            });

            if (!deleteResponse.ok) {
                const error = await deleteResponse.json().catch(() => ({ message: 'Unknown error' }));
                throw new Error(error.message || 'HTTP ' + deleteResponse.status);
            }

            await sleep(2000);
            loadFiles();
        }

        function readFileAsBase64(file) {
            return new Promise(function(resolve, reject) {
                const reader = new FileReader();
                reader.onload = function() {
                    resolve(reader.result.split(',')[1]);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function showProgress() {
            document.getElementById('progressContainer').style.display = 'block';
            document.getElementById('progressFill').style.width = '0%';
        }

        function updateProgress(pct, uploaded, total) {
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressText').textContent = 
                '已上传 ' + formatSize(uploaded) + ' / ' + formatSize(total);
        }

        function hideProgress() {
            document.getElementById('progressContainer').style.display = 'none';
        }

        async function loadFiles() {
            const grid = document.getElementById('filesGrid');
            grid.innerHTML = '<div class="loading-state">加载中...</div>';

            try {
                const response = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + FILES_DIR);
                if (response.status === 404) {
                    grid.innerHTML = '<div class="empty-state">暂无文件，拖拽或点击上传</div>';
                    return;
                }
                if (!response.ok) throw new Error('加载失败');

                let files = await response.json();
                files = files.filter(f => f.type === 'file');
                files.sort((a, b) => new Date(b.last_modified) - new Date(a.last_modified));
                allFiles = files;

                displayFiles(files);
            } catch (err) {
                grid.innerHTML = '<div class="empty-state">加载失败: ' + err.message + '</div>';
            }
        }

        function displayFiles(files) {
            const grid = document.getElementById('filesGrid');

            if (!files || files.length === 0) {
                grid.innerHTML = '<div class="empty-state">暂无文件，拖拽或点击上传</div>';
                return;
            }

            grid.innerHTML = files.map(function(file) {
                const icon = getFileIcon(file.name);
                const displayName = file.name.replace(/^\d+-/, '');
                const date = file.last_modified ? formatDate(file.last_modified) : '';
                return `
                    <div class="file-card">
                        <div class="icon">${icon}</div>
                        <div class="file-name" title="${displayName}">${displayName}</div>
                        <div class="file-meta">${formatSize(file.size)} · ${getFileType(file.name)}</div>
                        ${date ? '<div class="file-meta">' + date + '</div>' : ''}
                        <div class="file-actions">
                            <button class="action-btn preview-btn" onclick="previewFile(${JSON.stringify(file)})">预览</button>
                            <button class="action-btn download-btn" onclick="downloadFile(${JSON.stringify(file)})">下载</button>
                            <button class="action-btn delete-btn" onclick="deleteFile('${file.name}')">删除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterFiles(query) {
            if (!query.trim()) {
                displayFiles(allFiles);
                return;
            }
            const filtered = allFiles.filter(function(f) {
                return f.name.toLowerCase().includes(query.toLowerCase());
            });
            displayFiles(filtered);
        }

        function previewFile(file) {
            const name = file.name.replace(/^\d+-/, '');
            document.getElementById('previewTitle').textContent = name;
            document.getElementById('downloadLink').href = file.download_url;
            document.getElementById('downloadLink').download = name;

            const ext = file.name.split('.').pop().toLowerCase();
            let html = '';

            if (['jpg','jpeg','png','gif','webp','bmp'].includes(ext)) {
                html = '<img src="' + file.download_url + '" alt="' + name + '">';
            } else if (ext === 'pdf') {
                html = '<iframe src="https://mozilla.github.io/pdf.js/web/viewer.html?file=' + encodeURIComponent(file.download_url) + '"></iframe>';
            } else if (['mp4','webm','ogg'].includes(ext)) {
                html = '<video controls src="' + file.download_url + '">您的浏览器不支持视频播放</video>';
            } else if (['mp3','wav','ogg'].includes(ext)) {
                html = '<audio controls src="' + file.download_url + '" style="width:100%">您的浏览器不支持音频播放</audio>';
            } else if (['txt','json','html','css','js'].includes(ext)) {
                fetch(file.download_url).then(function(r) {
                    return r.text();
                }).then(function(text) {
                    document.getElementById('previewContent').innerHTML = '<pre>' + escapeHtml(text) + '</pre>';
                }).catch(function() {
                    document.getElementById('previewContent').innerHTML = '<div class="no-preview">无法预览文件内容</div>';
                });
                document.getElementById('previewModal').style.display = 'block';
                return;
            } else {
                html = '<div class="no-preview">暂不支持预览此文件类型</div>';
            }

            document.getElementById('previewContent').innerHTML = html;
            document.getElementById('previewModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('previewModal').style.display = 'none';
            document.getElementById('previewContent').innerHTML = '';
        }

        function downloadFile(file) {
            const a = document.createElement('a');
            a.href = file.download_url;
            a.download = file.name.replace(/^\d+-/, '');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function getFileIcon(name) {
            const ext = name.split('.').pop().toLowerCase();
            const icons = {
                jpg:'🖼️', jpeg:'🖼️', png:'🖼️', gif:'🖼️', webp:'🖼️', bmp:'🖼️',
                pdf:'📕', doc:'📘', docx:'📘', xls:'📗', xlsx:'📗', ppt:'📙', pptx:'📙',
                txt:'📄', zip:'📦', rar:'📦', 7z:'📦',
                mp4:'🎬', webm:'🎬', ogg:'🎬',
                mp3:'🎵', wav:'🎵',
                json:'📋', html:'🌐', css:'🎨', js:'💻'
            };
            return icons[ext] || '📄';
        }

        function getFileType(name) {
            const ext = name.split('.').pop().toLowerCase();
            const types = {
                jpg:'图片', jpeg:'图片', png:'图片', gif:'图片', webp:'图片', bmp:'图片',
                pdf:'PDF', doc:'Word', docx:'Word',
                xls:'Excel', xlsx:'Excel', ppt:'PPT', pptx:'PPT',
                txt:'文本', zip:'压缩', rar:'压缩', 7z:'压缩',
                mp4:'视频', webm:'视频', ogg:'视频',
                mp3:'音频', wav:'音频', ogg:'音频',
                json:'JSON', html:'HTML', css:'CSS', js:'JS'
            };
            return types[ext] || '其他';
        }

        function sleep(ms) {
            return new Promise(function(resolve) {
                setTimeout(resolve, ms);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
