<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件共享平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 24px;
        }
        .header .repo-info {
            font-size: 14px;
            color: #aaa;
        }
        .actions {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        .upload-btn {
            flex: 1;
            padding: 20px;
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 15px;
            background: rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .upload-btn:hover {
            border-color: #4CAF50;
            background: rgba(76,175,80,0.1);
        }
        .upload-btn input {
            display: none;
        }
        .upload-btn .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .search-box {
            padding: 20px;
            border-radius: 15px;
            background: rgba(255,255,255,0.05);
            margin-bottom: 20px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
        }
        .search-box input::placeholder {
            color: #888;
        }
        .file-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .file-item {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s;
        }
        .file-item:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-5px);
        }
        .file-item .file-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        .file-item .file-name {
            font-size: 16px;
            word-break: break-all;
            margin-bottom: 10px;
        }
        .file-item .file-info {
            font-size: 12px;
            color: #888;
            margin-bottom: 15px;
        }
        .file-item .file-actions {
            display: flex;
            gap: 10px;
        }
        .file-item .file-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .preview-btn {
            background: rgba(76,175,80,0.2);
            color: #4CAF50;
        }
        .preview-btn:hover {
            background: rgba(76,175,80,0.4);
        }
        .download-btn {
            background: rgba(33,150,243,0.2);
            color: #2196F3;
        }
        .download-btn:hover {
            background: rgba(33,150,243,0.4);
        }
        .delete-btn {
            background: rgba(244,67,54,0.2);
            color: #f44336;
        }
        .delete-btn:hover {
            background: rgba(244,67,54,0.4);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #1a1a2e;
            border-radius: 20px;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            overflow: auto;
        }
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 {
            font-size: 18px;
        }
        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }
        .modal-body {
            padding: 20px;
        }
        .preview-container {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 20px;
            min-height: 300px;
            max-height: 60vh;
            overflow: auto;
        }
        .preview-container img {
            max-width: 100%;
            border-radius: 8px;
        }
        .preview-container pre {
            white-space: pre-wrap;
            word-break: break-all;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        .preview-container .no-preview {
            color: #888;
            text-align: center;
            padding: 50px;
        }
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            flex-direction: column;
        }
        .loading.active {
            display: flex;
        }
        .loading-text {
            margin-top: 15px;
            color: #fff;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            border-radius: 10px;
            background: #333;
            color: #fff;
            z-index: 3000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.active {
            opacity: 1;
        }
        .toast.success {
            background: #4CAF50;
        }
        .toast.error {
            background: #f44336;
        }
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #888;
        }
        .empty-state .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .progress-bar {
            width: 200px;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-bar .progress {
            height: 100%;
            background: #4CAF50;
            border-radius: 3px;
            transition: width 0.3s;
        }
        .security-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(76,175,80,0.2);
            color: #4CAF50;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📁 文件共享平台</h1>
                <div class="security-badge">🔒 安全模式 - Actions 后端</div>
            </div>
            <div class="repo-info" id="repoInfo"></div>
        </div>

        <div class="actions">
            <label class="upload-btn">
                <input type="file" id="fileInput" multiple onchange="uploadFiles()">
                <div class="icon">⬆️</div>
                <div>点击或拖拽文件上传</div>
            </label>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索文件..." oninput="filterFiles()">
        </div>

        <div class="file-list" id="fileList"></div>
    </div>

    <div class="modal" id="previewModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="previewFileName">文件预览</h2>
                <button class="modal-close" onclick="closePreview()">×</button>
            </div>
            <div class="modal-body">
                <div class="preview-container" id="previewContainer"></div>
            </div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">加载中...</div>
        <div class="progress-bar" id="progressBar" style="display:none;">
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // 仓库配置 - 仅需在此修改
        const REPO_OWNER = 'star-sky-suger';
        const REPO_NAME = 'myku';
        const STORAGE_PATH = 'files/';
        const STATUS_PATH = 'status/';
        
        let cachedFiles = [];
        let defaultBranch = 'main';

        window.onload = function() {
            document.getElementById('repoInfo').textContent = `${REPO_OWNER}/${REPO_NAME}`;
            initApp();
        };

        function generateRequestId() {
            return 'req_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast active ' + type;
            setTimeout(() => toast.classList.remove('active'), 3000);
        }

        function showLoading(text = '加载中...') {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loading').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
            document.getElementById('progressBar').style.display = 'none';
        }

        function updateProgress(percent) {
            const progressBar = document.getElementById('progressBar');
            const progress = document.getElementById('progress');
            progressBar.style.display = 'block';
            progress.style.width = percent + '%';
        }

        async function initApp() {
            await getDefaultBranch();
            loadFiles();
        }

        async function getDefaultBranch() {
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`);
                if (response.ok) {
                    const data = await response.json();
                    defaultBranch = data.default_branch || 'main';
                }
            } catch (e) {
                console.log('获取默认分支失败，使用 main');
            }
        }

        async function loadFiles() {
            showLoading('加载文件列表...');
            
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${STORAGE_PATH}?ref=${defaultBranch}`
                );

                if (response.status === 404) {
                    cachedFiles = [];
                    renderFiles([]);
                    hideLoading();
                    return;
                }

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || '获取文件列表失败');
                }

                const data = await response.json();
                
                if (!Array.isArray(data)) {
                    cachedFiles = [];
                    renderFiles([]);
                    hideLoading();
                    return;
                }

                cachedFiles = data
                    .filter(item => item.type === 'file' && item.name !== '.gitkeep')
                    .map(item => ({
                        name: item.name,
                        path: item.path,
                        sha: item.sha,
                        size: item.size,
                        type: item.type
                    }));
                
                renderFiles(cachedFiles);
                hideLoading();
                
            } catch (error) {
                hideLoading();
                showToast('加载文件失败: ' + error.message, 'error');
            }
        }

        function renderFiles(files) {
            const fileList = document.getElementById('fileList');
            
            if (!files || files.length === 0) {
                fileList.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📂</div>
                        <div>暂无文件</div>
                        <div style="margin-top:10px;font-size:14px;">上传一些文件开始分享吧！</div>
                    </div>
                `;
                return;
            }
            
            fileList.innerHTML = files.map(file => {
                const icon = getFileIcon(file.name, file.size);
                const displaySize = formatFileSize(file.size);
                
                return `
                    <div class="file-item">
                        <div class="file-icon">${icon}</div>
                        <div class="file-name">${escapeHtml(file.name)}</div>
                        <div class="file-info">${displaySize}</div>
                        <div class="file-actions">
                            <button class="preview-btn" onclick="previewFile('${encodeURIComponent(file.name)}', '${encodeURIComponent(file.path)}')">预览</button>
                            <button class="download-btn" onclick="downloadFile('${encodeURIComponent(file.name)}', '${encodeURIComponent(file.path)}')">下载</button>
                            <button class="delete-btn" onclick="deleteFile('${encodeURIComponent(file.name)}', '${encodeURIComponent(file.path)}')">删除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterFiles() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = cachedFiles.filter(file => 
                file.name.toLowerCase().includes(searchTerm)
            );
            renderFiles(filtered);
        }

        function getFileIcon(filename, size) {
            const ext = filename.split('.').pop().toLowerCase();
            const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg', 'ico'];
            const docExts = ['doc', 'docx', 'pdf', 'txt', 'rtf'];
            const codeExts = ['js', 'html', 'css', 'json', 'xml', 'py', 'java', 'c', 'cpp', 'h'];
            const videoExts = ['mp4', 'avi', 'mov', 'wmv', 'flv', 'webm'];
            const audioExts = ['mp3', 'wav', 'ogg', 'flac', 'aac'];
            const archiveExts = ['zip', 'rar', '7z', 'tar', 'gz'];
            
            if (imageExts.includes(ext)) return '🖼️';
            if (docExts.includes(ext)) return '📄';
            if (codeExts.includes(ext)) return '💻';
            if (videoExts.includes(ext)) return '🎬';
            if (audioExts.includes(ext)) return '🎵';
            if (archiveExts.includes(ext)) return '📦';
            if (size > 50 * 1024 * 1024) return '💾';
            return '📎';
        }

        function formatFileSize(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function decodeBase64(base64) {
            try {
                const binaryString = atob(base64);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                return new TextDecoder('utf-8').decode(bytes);
            } catch (e) {
                return atob(base64);
            }
        }

        function base64ToBlob(base64, mimeType) {
            const byteCharacters = atob(base64);
            const byteArrays = [];
            const sliceSize = 512;
            
            for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                const slice = byteCharacters.slice(offset, offset + sliceSize);
                const byteNumbers = new Array(slice.length);
                for (let i = 0; i < slice.length; i++) {
                    byteNumbers[i] = slice.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                byteArrays.push(byteArray);
            }
            
            return new Blob(byteArrays, { type: mimeType });
        }

        function getMimeType(ext) {
            const mimeTypes = {
                'jpg': 'image/jpeg', 'jpeg': 'image/jpeg', 'png': 'image/png',
                'gif': 'image/gif', 'bmp': 'image/bmp', 'webp': 'image/webp',
                'svg': 'image/svg+xml', 'ico': 'image/x-icon'
            };
            return mimeTypes[ext] || 'application/octet-stream';
        }

        async function uploadFiles() {
            const fileInput = document.getElementById('fileInput');
            const files = Array.from(fileInput.files);
            
            if (files.length === 0) return;
            
            showLoading(`准备上传 ${files.length} 个文件...`);
            
            let successCount = 0;
            let failCount = 0;
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                try {
                    const base64Content = await fileToBase64(file);
                    const requestId = generateRequestId();
                    
                    updateProgress(Math.round((i / files.length) * 100));
                    document.getElementById('loadingText').textContent = `上传中: ${file.name} (${i + 1}/${files.length})`;
                    
                    // 触发 GitHub Actions workflow
                    const response = await fetch(
                        `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/dispatches`,
                        {
                            method: 'POST',
                            headers: {
                                'Accept': 'application/vnd.github.v3+json',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                event_type: 'files-api',
                                client_payload: {
                                    action: 'upload',
                                    request_id: requestId,
                                    filename: file.name,
                                    content: base64Content
                                }
                            })
                        }
                    );
                    
                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.message || '触发上传失败');
                    }
                    
                    // 等待 Actions 完成
                    const result = await waitForResult(requestId);
                    
                    if (result && result.success) {
                        successCount++;
                    } else {
                        throw new Error(result?.error || '上传失败');
                    }
                } catch (error) {
                    showToast(`上传失败 ${file.name}: ${error.message}`, 'error');
                    failCount++;
                }
            }
            
            fileInput.value = '';
            hideLoading();
            
            if (successCount > 0) {
                showToast(`成功上传 ${successCount} 个文件`, 'success');
            }
            if (failCount > 0) {
                showToast(`${failCount} 个文件上传失败`, 'error');
            }
            
            loadFiles();
        }

        async function waitForResult(requestId, maxAttempts = 60) {
            for (let i = 0; i < maxAttempts; i++) {
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                try {
                    const response = await fetch(
                        `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${defaultBranch}/${STATUS_PATH}${requestId}.json`
                    );

                    if (response.ok) {
                        const result = await response.json();
                        return result;
                    }
                } catch (e) {
                    // 继续等待
                }

                updateProgress(Math.round((i / maxAttempts) * 100));
            }

            return null;
        }

        async function previewFile(filename, path) {
            filename = decodeURIComponent(filename);
            path = decodeURIComponent(path);
            
            showLoading('加载预览...');
            
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}?ref=${defaultBranch}`
                );
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || '获取文件失败');
                }
                
                const data = await response.json();
                
                if (!data.content) {
                    throw new Error('文件内容为空');
                }
                
                document.getElementById('previewFileName').textContent = filename;
                const container = document.getElementById('previewContainer');
                
                const ext = filename.split('.').pop().toLowerCase();
                const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg', 'ico'];
                const textExts = ['txt', 'js', 'html', 'css', 'json', 'xml', 'py', 'java', 'c', 'cpp', 'h', 'md', 'sh', 'yaml', 'yml', 'log', 'ini', 'conf'];
                
                if (imageExts.includes(ext)) {
                    try {
                        const mimeType = getMimeType(ext);
                        const blob = base64ToBlob(data.content, mimeType);
                        const url = URL.createObjectURL(blob);
                        container.innerHTML = `<img src="${url}" alt="${escapeHtml(filename)}" style="max-width:100%;">`;
                    } catch (e) {
                        container.innerHTML = `<div class="no-preview">图片预览失败: ${e.message}</div>`;
                    }
                } else if (textExts.includes(ext) || data.size < 100 * 1024) {
                    try {
                        const content = decodeBase64(data.content);
                        if (ext === 'json') {
                            try {
                                const json = JSON.parse(content);
                                container.innerHTML = `<pre>${escapeHtml(JSON.stringify(json, null, 2))}</pre>`;
                            } catch {
                                container.innerHTML = `<pre>${escapeHtml(content)}</pre>`;
                            }
                        } else {
                            container.innerHTML = `<pre>${escapeHtml(content)}</pre>`;
                        }
                    } catch (e) {
                        container.innerHTML = `<div class="no-preview">文本解码失败，请下载查看</div>`;
                    }
                } else {
                    container.innerHTML = `<div class="no-preview">文件较大 (${formatFileSize(data.size)})，请下载后查看</div>`;
                }
                
                document.getElementById('previewModal').classList.add('active');
                hideLoading();
                
            } catch (error) {
                hideLoading();
                showToast('预览失败: ' + error.message, 'error');
            }
        }

        function closePreview() {
            document.getElementById('previewModal').classList.remove('active');
        }

        async function downloadFile(filename, path) {
            filename = decodeURIComponent(filename);
            path = decodeURIComponent(path);
            
            showLoading('准备下载...');
            
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}?ref=${defaultBranch}`
                );
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || '获取文件失败');
                }
                
                const data = await response.json();
                
                if (!data.content) {
                    throw new Error('文件内容为空');
                }
                
                const ext = filename.split('.').pop().toLowerCase();
                const mimeType = getMimeType(ext);
                const blob = base64ToBlob(data.content, mimeType);
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                hideLoading();
                showToast('下载成功', 'success');
                
            } catch (error) {
                hideLoading();
                showToast('下载失败: ' + error.message, 'error');
            }
        }

        async function deleteFile(filename, path) {
            if (!confirm(`确定要删除文件 "${filename}" 吗？`)) return;
            
            filename = decodeURIComponent(filename);
            path = decodeURIComponent(path);
            
            showLoading('删除中...');
            
            try {
                const requestId = generateRequestId();
                
                // 触发 GitHub Actions workflow
                const response = await fetch(
                    `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/dispatches`,
                    {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            event_type: 'files-api',
                            client_payload: {
                                action: 'delete',
                                request_id: requestId,
                                filename: filename
                            }
                        })
                    }
                );
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || '触发删除失败');
                }
                
                // 等待 Actions 完成
                const result = await waitForResult(requestId);
                
                if (result && result.success) {
                    hideLoading();
                    showToast('删除成功', 'success');
                    loadFiles();
                } else {
                    throw new Error(result?.error || '删除失败');
                }
            } catch (error) {
                hideLoading();
                showToast('删除失败: ' + error.message, 'error');
            }
        }

        document.getElementById('previewModal').addEventListener('click', function(e) {
            if (e.target === this) closePreview();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closePreview();
            }
        });
    </script>
</body>
</html>
