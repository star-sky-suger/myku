<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件共享平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #f5f5f5; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 2rem; color: #333; }
        
        .upload-box {
            background: white;
            border: 3px dashed #ccc;
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 2rem;
        }
        .upload-box:hover, .upload-box.dragover {
            border-color: #007bff;
            background: #f0f8ff;
        }
        .upload-box .icon { font-size: 3rem; margin-bottom: 1rem; }
        .upload-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }
        .upload-btn:hover { background: #0056b3; }
        #fileInput { display: none; }
        
        .progress { display: none; margin-bottom: 2rem; padding: 1rem; background: white; border-radius: 8px; }
        .progress-bar { height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin-bottom: 0.5rem; }
        .progress-fill { height: 100%; background: #007bff; width: 0%; }
        
        .files-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
        .file-card { background: white; padding: 1rem; border-radius: 8px; text-align: center; }
        .file-card .icon { font-size: 2rem; }
        .file-name { font-weight: 500; margin: 0.5rem 0; }
        .file-info { font-size: 0.8rem; color: #666; }
        
        .empty-state { text-align: center; color: #666; padding: 2rem; background: white; border-radius: 8px; }
        .loading { text-align: center; color: #666; padding: 2rem; }
        
        @media (max-width: 600px) {
            body { padding: 1rem; }
            .upload-box { padding: 2rem 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 文件共享平台</h1>
        
        <div class="upload-box" id="uploadBox">
            <div class="icon">📤</div>
            <p>拖拽文件到此处上传</p>
            <p>或</p>
            <button class="upload-btn" id="uploadBtn">选择文件</button>
            <input type="file" id="fileInput" multiple>
        </div>
        
        <div class="progress" id="progress">
            <div class="progress-bar"><div class="progress-fill"></div></div>
            <div class="progress-text">上传中...</div>
        </div>
        
        <div class="files-container" id="filesContainer">
            <div class="loading">加载中...</div>
        </div>
    </div>

    <script>
        // 配置
        const GITHUB_REPO = window.APP_CONFIG?.GITHUB_REPO || 'star-sky-suger/myku';
        const GH_TOKEN = window.APP_CONFIG?.GH_TOKEN || '';
        const FILES_DIR = 'files/';
        
        console.log('Config loaded:', { GITHUB_REPO, hasToken: GH_TOKEN ? 'Yes' : 'No' });
        
        document.addEventListener('DOMContentLoaded', function() {
            const uploadBox = document.getElementById('uploadBox');
            const uploadBtn = document.getElementById('uploadBtn');
            const fileInput = document.getElementById('fileInput');
            const filesContainer = document.getElementById('filesContainer');
            const progress = document.getElementById('progress');
            
            // 点击按钮
            uploadBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                fileInput.click();
            });
            
            // 点击上传区域
            uploadBox.addEventListener('click', function(e) {
                if (e.target !== uploadBtn) {
                    fileInput.click();
                }
            });
            
            // 文件选择
            fileInput.addEventListener('change', function(e) {
                const files = Array.from(e.target.files);
                if (files.length > 0) {
                    uploadFiles(files);
                }
                e.target.value = '';
            });
            
            // 拖拽事件
            uploadBox.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadBox.classList.add('dragover');
            });
            
            uploadBox.addEventListener('dragleave', function(e) {
                e.preventDefault();
                uploadBox.classList.remove('dragover');
            });
            
            uploadBox.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadBox.classList.remove('dragover');
                
                const files = Array.from(e.dataTransfer.files);
                if (files.length > 0) {
                    uploadFiles(files);
                }
            });
            
            // 全局阻止默认拖拽行为
            document.addEventListener('dragover', function(e) { e.preventDefault(); });
            document.addEventListener('drop', function(e) { e.preventDefault(); });
            
            // 加载文件列表
            loadFiles();
        });
        
        async function uploadFiles(files) {
            if (!GH_TOKEN) {
                alert('错误：未配置上传令牌，请检查部署配置');
                return;
            }
            
            const progress = document.getElementById('progress');
            const progressFill = progress.querySelector('.progress-fill');
            const progressText = progress.querySelector('.progress-text');
            
            progress.style.display = 'block';
            progressFill.style.width = '0%';
            
            const totalSize = files.reduce((sum, f) => sum + f.size, 0);
            let uploadedSize = 0;
            
            for (const file of files) {
                try {
                    await uploadFile(file);
                    uploadedSize += file.size;
                    const pct = Math.round((uploadedSize / totalSize) * 100);
                    progressFill.style.width = pct + '%';
                    progressText.textContent = '已上传 ' + formatSize(uploadedSize) + ' / ' + formatSize(totalSize);
                } catch (err) {
                    console.error('Upload error:', err);
                    alert('上传失败: ' + err.message);
                }
            }
            
            progress.style.display = 'none';
            await sleep(2000);
            loadFiles();
        }
        
        async function uploadFile(file) {
            const filename = Date.now() + '-' + file.name;
            const content = await readFileAsBase64(file);
            
            const response = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + FILES_DIR + filename, {
                method: 'PUT',
                headers: {
                    'Accept': 'application/vnd.github.v3+json',
                    'Authorization': 'token ' + GH_TOKEN,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: 'Upload file: ' + filename,
                    content: content,
                    branch: 'main'
                })
            });
            
            console.log('Response:', response.status);
            
            if (!response.ok) {
                const error = await response.json().catch(() => ({ message: 'Unknown error' }));
                throw new Error(error.message || 'HTTP ' + response.status);
            }
        }
        
        async function deleteFile(filename) {
            if (!confirm('确定删除此文件?')) return;
            
            // 先获取文件sha
            const getResponse = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + FILES_DIR + filename, {
                headers: { 'Authorization': 'token ' + GH_TOKEN }
            });
            
            if (!getResponse.ok) {
                alert('获取文件信息失败');
                return;
            }
            
            const fileInfo = await getResponse.json();
            const sha = fileInfo.sha;
            
            const deleteResponse = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + FILES_DIR + filename, {
                method: 'DELETE',
                headers: {
                    'Authorization': 'token ' + GH_TOKEN,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: 'Delete file: ' + filename,
                    sha: sha,
                    branch: 'main'
                })
            });
            
            if (!deleteResponse.ok) {
                const error = await deleteResponse.json().catch(() => ({ message: 'Unknown error' }));
                throw new Error(error.message || 'HTTP ' + deleteResponse.status);
            }
            
            await sleep(2000);
            loadFiles();
        }
        
        function readFileAsBase64(file) {
            return new Promise(function(resolve, reject) {
                const reader = new FileReader();
                reader.onload = function() { resolve(reader.result.split(',')[1]); };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
        
        async function loadFiles() {
            const container = document.getElementById('filesContainer');
            container.innerHTML = '<div class="loading">加载中...</div>';
            
            try {
                const response = await fetch('https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + FILES_DIR);
                if (response.status === 404) {
                    container.innerHTML = '<div class="empty-state">暂无文件，拖拽或点击上传</div>';
                    return;
                }
                if (!response.ok) throw new Error('加载失败');
                
                let files = await response.json();
                files = files.filter(f => f.type === 'file');
                
                if (files.length === 0) {
                    container.innerHTML = '<div class="empty-state">暂无文件，拖拽或点击上传</div>';
                    return;
                }
                
                container.innerHTML = files.map(function(file) {
                    const icon = getIcon(file.name);
                    const displayName = file.name.replace(/^\d+-/, '');
                    return `
                        <div class="file-card">
                            <div class="icon">${icon}</div>
                            <div class="file-name" title="${displayName}">${displayName}</div>
                            <div class="file-info">${formatSize(file.size)}</div>
                            <div style="margin-top: 0.5rem; display: flex; gap: 0.3rem; justify-content: center;">
                                <a href="${file.download_url}" download="${displayName}" style="font-size:0.7rem;color:#007bff">下载</a>
                                <button onclick="deleteFile('${file.name}')" style="font-size:0.7rem;color:#dc3545;border:none;background:none;cursor:pointer">删除</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = '<div class="empty-state">加载失败: ' + err.message + '</div>';
            }
        }
        
        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
        }
        
        function getIcon(name) {
            const ext = name.split('.').pop().toLowerCase();
            const icons = {
                jpg:'🖼️', jpeg:'🖼️', png:'🖼️', gif:'🖼️', webp:'🖼️',
                pdf:'📕', doc:'📘', docx:'📘',
                xls:'📗', xlsx:'📗', ppt:'📙', pptx:'📙',
                txt:'📄', zip:'📦', rar:'📦',
                mp4:'🎬', mp3:'🎵', json:'📋'
            };
            return icons[ext] || '📄';
        }
        
        function sleep(ms) {
            return new Promise(function(r) { setTimeout(r, ms); });
        }
    </script>
</body>
</html>
