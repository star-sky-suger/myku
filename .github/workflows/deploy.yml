name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate config.js with environment variables
        run: |
          echo "// 配置文件 - 由GitHub Actions自动生成" > config.js
          echo "window.APP_CONFIG = {" >> config.js
          echo "    GITHUB_REPO: '${{ github.repository }}'," >> config.js
          echo "    BRANCH: 'main'," >> config.js
          echo "    FILES_DIR: 'files/'}" >> config.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: .
          force_orphan: true
