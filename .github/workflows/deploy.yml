name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Generate config.js with environment variables
        run: |
          echo "window.APP_CONFIG = {" > config.js
          echo "    GITHUB_REPO: '${{ github.repository }}'," >> config.js
          echo "    GH_TOKEN: '${{ secrets.GH_TOKEN }}'," >> config.js
          echo "    BRANCH: 'main'," >> config.js
          echo "    FILES_DIR: 'files/'}" >> config.js

      - name: Update index.html with injected config
        run: |
          sed -i "s|const GITHUB_REPO = 'star-sky-suger/myku';|const GITHUB_REPO = window.APP_CONFIG?.GITHUB_REPO || 'star-sky-suger/myku';|g" index.html
          sed -i "s|const GH_TOKEN = '';|const GH_TOKEN = window.APP_CONFIG?.GH_TOKEN || '';|g" index.html
          sed -i "/<script src=\"config.js\"><\/script>/d" index.html
          sed -i "/<script>/i\\    <script src=\"config.js\"></script>" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4