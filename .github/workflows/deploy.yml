name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Generate config.js with environment variables
        run: |
          echo "// 配置文件 - 由GitHub Actions自动生成" > config.js
          echo "window.APP_CONFIG = {" >> config.js
          echo "    GITHUB_REPO: '${{ github.repository }}'," >> config.js
          echo "    GH_TOKEN: '${{ secrets.GH_TOKEN }}'," >> config.js
          echo "    BRANCH: 'main'," >> config.js
          echo "    FILES_DIR: 'files/'}" >> config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4