name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 必须的权限，缺一不可
permissions:
  contents: read
  pages: write
  id-token: write

# 防止并发部署冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 生成 config.js（保留你原来的逻辑）
      - name: Generate config.js
        run: |
          echo "// 自动生成的配置文件" > config.js
          echo "window.APP_CONFIG = {" >> config.js
          echo "  GITHUB_REPO: '${{ github.repository }}'," >> config.js
          echo "  BRANCH: 'main'," >> config.js
          echo "  FILES_DIR: 'files/'" >> config.js
          echo "};" >> config.js

      # 官方步骤1：初始化 Pages 环境
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 官方步骤2：把你的文件打包成 Pages 能识别的产物
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # 发布根目录所有文件，包括你上传到 files/ 里的文件

      # 官方步骤3：真正触发 GitHub Pages 发布
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4