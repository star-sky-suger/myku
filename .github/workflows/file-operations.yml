name: File Operations
on:
  workflow_dispatch:
    inputs:
      action:
        description: file-upload / file-delete
        required: true
        type: choice
        options:
          - file-upload
          - file-delete
      filename:
        description: 文件名
        required: true
        type: string
jobs:
  file-operation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Resolve params
        id: resolve-params
        run: |
          echo "action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
          echo "filename=${{ github.event.inputs.filename }}" >> $GITHUB_OUTPUT

      - name: Validate
        run: |
          if [ -z "${{ steps.resolve-params.outputs.filename }}" ]; then exit 1; fi

      - name: Prepare dir
        run: mkdir -p files

      - name: Create empty file (占位，解决inputs过大)
        if: steps.resolve-params.outputs.action == 'file-upload'
        env:
          FN: ${{ steps.resolve-params.outputs.filename }}
        run: |
          echo "placeholder" > files/$FN

      - name: Delete file
        if: steps.resolve-params.outputs.action == 'file-delete'
        env:
          FN: ${{ steps.resolve-params.outputs.filename }}
        run: |
          rm -f files/$FN

      - name: Commit & push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add files/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "File: $FN"
          git push origin main