name: File Operations
on:
  repository_dispatch:
    types: [file-upload, file-delete]

jobs:
  file-operation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Resolve params
        id: resolve
        run: |
          echo "action=${{ github.event.action }}" >> $GITHUB_OUTPUT
          echo "filename=${{ github.client_payload.filename }}" >> $GITHUB_OUTPUT
          echo "content=${{ github.client_payload.content }}" >> $GITHUB_OUTPUT

      - name: Validate
        run: |
          if [ -z "${{ steps.resolve.outputs.filename }}" ]; then exit 1; fi

      - name: Prepare dir
        run: mkdir -p files

      - name: Upload file
        if: github.event.action == 'file-upload'
        env:
          FN: ${{ steps.resolve.outputs.filename }}
          B64: ${{ steps.resolve.outputs.content }}
        run: |
          echo "$B64" | base64 -d > "files/$FN"

      - name: Delete file
        if: github.event.action == 'file-delete'
        env:
          FN: ${{ steps.resolve.outputs.filename }}
        run: |
          rm -f "files/$FN"

      - name: Commit & push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add files/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "File: $FN"
          git push origin main