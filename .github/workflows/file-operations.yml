name: File Operations
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action: file-upload / file-delete'
        required: true
        type: string
      filename:
        required: false
        type: string
      content:
        required: false
        type: string

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call repository_dispatch
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://api.github.com/repos/${{ github.repository }}/dispatches'
          method: 'POST'
          contentType: 'application/json'
          data: |
            {
              "event_type": "${{ github.event.inputs.action }}",
              "client_payload": {
                "filename": "${{ github.event.inputs.filename }}",
                "content": "${{ github.event.inputs.content }}"
              }
            }
          bearerToken: ${{ secrets.GH_TOKEN }}

  upload-file:
    if: github.event.action == 'file-upload' || github.event.inputs.action == 'file-upload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure files directory
        run: mkdir -p files
      - name: Decode and save file
        env:
          FN: ${{ github.event.client_payload.filename || github.event.inputs.filename }}
          B64: ${{ github.event.client_payload.content || github.event.inputs.content }}
        run: |
          echo "$B64" | base64 -d > "files/$FN"
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add files/
          git commit -m "Upload: $FN" || echo "No changes to commit"
          git push

  delete-file:
    if: github.event.action == 'file-delete' || github.event.inputs.action == 'file-delete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete file
        env:
          FN: ${{ github.event.client_payload.filename || github.event.inputs.filename }}
        run: |
          if [ -f "files/$FN" ]; then
            rm "files/$FN"
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add files/
            git commit -m "Delete: $FN" || echo "No changes to commit"
            git push
          fi