name: File Operations
on:
  workflow_dispatch:
    inputs:
      action:
        description: file-upload / file-delete
        required: true
        type: choice
        options:
          - file-upload
          - file-delete
      filename:
        description: 文件名
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Resolve
        id: resolve
        run: |
          echo "action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
          echo "filename=${{ github.event.inputs.filename }}" >> $GITHUB_OUTPUT

      - name: Prepare dir
        run: mkdir -p files

      - name: Create empty file (upload)
        if: github.event.inputs.action == 'file-upload'
        env:
          FN: ${{ steps.resolve.outputs.filename }}
        run: |
          echo "placeholder" > "files/$FN"

      - name: Delete file
        if: github.event.inputs.action == 'file-delete'
        env:
          FN: ${{ steps.resolve.outputs.filename }}
        run: |
          rm -f "files/$FN"

      - name: Commit & push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "GitHub Bot"
          git add files/
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "File: $FN"
          git push origin main